# /etc/dsb/dsb.conf: who may act as which dsb identity, and how.
# Also read: /etc/dsb/conf.d/*.conf (handy for one identity per file).
#
# Nothing is enabled until an identity has callers. After every edit:
#   dsb-admin apply      (validates first; a bad file changes nothing)
#
# [global] callers, env, timeout: defaults for every identity
#          deny-paths, deny-groups, deny-caps: add to the built-in deny list
#          (dsb-admin check --show-deny); nothing can remove from it
# [identity NAME]         socket /run/dsb/NAME.sock, used as dsb -u NAME
#   user     = dsb-NAME   system user, created on apply ("dsb" for [identity
#                         dsb]), another dsb-* name, or "dynamic" for a new
#                         uid per call (no shell then); never a person
#   callers  =            users allowed to call it (never root)
#   shell    = no         yes: interactive shell, -s, -i, -c, -f
#   edit     = yes        no: dsb -e refused
#   commands = *          absolute paths it may execute, or * for anything;
#                         checked by dsbd and by the kernel (ExecPaths=), so
#                         a shell or script cannot reach past the list
#   write    =            paths it may write, besides its home and /tmp:
#                         below /srv, /var/lib, /var/cache, or /var/www,
#                         owned by no package
#   groups   =            supplementary groups: audio video render plugdev
#                         dialout cdrom floppy tape systemd-journal dsb*
#   caps     =            ambient capabilities: CAP_NET_BIND_SERVICE
#                         CAP_NET_RAW CAP_SYS_NICE CAP_SYS_TIME CAP_IPC_LOCK
#                         CAP_WAKE_ALARM CAP_BLOCK_SUSPEND
#   write-extra, groups-extra, caps-extra =
#                         the same outside those lists, with a warning on
#                         every check; never on the deny list
#   network  = yes        no: PrivateNetwork, only unix sockets
#   devices  = auto       none: PrivateDevices even with a device group
#   jit      = yes        no: MemoryDenyWriteExecute
#   namespaces = no       yes: user namespaces and mounts (bwrap, podman)
#   env      =            caller variables let through; NAME* is a prefix
#   timeout  = 0          seconds before TERM (then KILL); 0 = none
# Everything else is read-only. The lists and their sources:
# /usr/share/doc/dsb/standards.md. Grant data, never config a root-started
# service reads (/etc/nginx, /etc/cups, ...): that is root.

[global]
callers =
env     = TERM COLORTERM LANG LANGUAGE LC_*
timeout = 0

[identity dsb]
# the everyday middle identity: a shell and any command, in the sandbox
shell    = yes
commands = *

# Examples:
#
# [identity web]
# callers  = alice
# write    = /srv/www
# commands = /usr/bin/rsync /usr/bin/install /usr/bin/rm /usr/bin/ls
#
# [identity probe]
# user     = dynamic
# callers  = alice
# commands = /usr/bin/ping /usr/bin/ss
# caps     = CAP_NET_RAW
# timeout  = 60
